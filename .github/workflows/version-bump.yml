name: version-bump

# Stage 1 of the two-stage release pipeline (OSS_SPEC §10.3): manual-only.
# Computes the next semver from the conventional-commit stream since the last
# tag (or takes an explicit bump), tags it, and pushes the tag with
# RELEASE_TOKEN — a PAT, because a tag pushed with the default GITHUB_TOKEN
# would not trigger the downstream release workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump kind"
        required: true
        default: "auto"
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Resolve next version
        id: ver
        run: |
          ./scripts/release.sh "${{ inputs.bump }}"
      - name: Push tag
        run: git push origin "v${{ steps.ver.outputs.version }}"
