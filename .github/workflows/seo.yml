name: seo

# §11.3.10 — structural SEO assertions. Runs `check-seo.mjs` against the
# built app so the discoverability failure modes the spec calls out (missing
# canonical, JSON-LD drift from og:image, orphaned sitemap entries, llms.txt
# missing) cannot ship silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm run check:seo
