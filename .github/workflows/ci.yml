name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Include `labeled` / `unlabeled` so the `no-changelog` escape hatch
    # re-runs the changeset job when the label is toggled after the PR opened.
    # The default activity types (`opened`, `synchronize`, `reopened`) would
    # otherwise leave the check stuck red until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make build

  # The native wrapper (native/) is a separate Expo app with its own dependency
  # tree, so nothing in the `build` job above touches it. This job is the guard
  # that its sources still compile — cheap, because it never builds a native
  # binary; that only happens on manual dispatch (see native.yml).
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  changeset:
    # Enforces that every PR touching user-visible code drops a changelog
    # fragment under `.changes/unreleased/` — the release workflow collates
    # those into the CHANGELOG and derives the semver bump from them, so a
    # missing fragment means a change that ships invisibly. Pure refactors,
    # CI/build tweaks, and docs-only edits pass via the skip-list inside the
    # script; opt a genuinely invisible change out with the `no-changelog`
    # label.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check for a changelog fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/release/check-changeset.mjs

  # Lint workflow YAML with actionlint and shell scripts with shellcheck
  # (OSS_SPEC §16.1). shellcheck is preinstalled on ubuntu-latest; actionlint
  # is fetched via its official installer.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"
      - name: make actionlint
        run: make actionlint
      - name: make shellcheck
        run: make shellcheck
