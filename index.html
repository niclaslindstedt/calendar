<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. The
     wall-calendar look defaults to a light "paper" family. -->
<html lang="en" data-theme="githubLight">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `viewport-fit=cover` lets the app paint under the notch / home
         indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Both schemes are supported, so the browser paints its own surfaces —
         form controls, scrollbars, and the canvas behind the page — to match
         the active theme instead of assuming light. Without it a dark theme
         still gets a white canvas, which is what the installed iOS app fills
         the status-bar band with. -->
    <meta name="color-scheme" content="dark light" />
    <title>Calendar</title>
    <meta
      name="description"
      content="Calendar is a local-first wall-calendar PWA. A monthly view with week numbers, red Sundays, and name days (UK & Sweden); click a date and type a note meant to be read by you later — no reminders, no accounts. Entries live on your device and can sync to Dropbox or a local folder."
    />
    <!-- The website is not meant to be found — people should reach the App
         Store page and apps.agilator.se — so every slot asks search engines
         not to index it (owner decision: no SEO). The build copies this head
         into privacy/index.html too. -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calendar" />
    <meta
      property="og:description"
      content="A local-first wall-calendar PWA: monthly view with week numbers and name days (UK & Sweden), a week planner, per-day notes, and storage backends you control."
    />
    <meta property="og:url" content="https://calendar.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://calendar.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calendar" />
    <meta
      name="twitter:description"
      content="A local-first wall-calendar PWA: monthly view with week numbers and name days, a week planner, and per-day notes — no reminders."
    />
    <meta
      name="twitter:image"
      content="https://calendar.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
