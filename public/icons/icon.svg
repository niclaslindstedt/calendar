<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a stylised calendar page — two hangers, a solid header
       band, one marked day — in mint green on a near-black tile, the same
       family look as the sibling checklist and notes apps.
       scripts/generate-icons.mjs mirrors this geometry for the PNG icons;
       keep the two in lockstep. -->
  <rect width="100" height="100" rx="18" fill="#1b2027" />
  <g fill="#6fe3a3">
    <!-- The hangers, drawn first so the body's top edge swallows their feet. -->
    <rect x="31" y="10" width="10" height="20" rx="5" />
    <rect x="59" y="10" width="10" height="20" rx="5" />
    <rect x="14" y="26" width="72" height="64" rx="14" />
  </g>
  <!-- The grid area, punched back out to the tile colour: what is left of the
       green body reads as a header band and an even frame. -->
  <rect x="22" y="48" width="56" height="34" rx="6" fill="#1b2027" />
  <!-- The marked day. -->
  <rect x="44" y="59" width="12" height="12" rx="3" fill="#6fe3a3" />
</svg>
